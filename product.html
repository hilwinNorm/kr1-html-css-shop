		<link rel="stylesheet" href="css/style.css">
		<script src="js/main.js" defer></script>
	</head>
	<body>
		<header class="site-header">
			<div class="site-header__inner">
			<a class="site-header__logo" href="index.html">ShopProject</a>
				<nav class="site-nav" aria-label="Основная навигация">
					<ul class="site-nav__list">
						<li class="site-nav__item">
							<a class="site-nav__link" href="index.html">
							Главная
							</a>
						</li>
						<li class="site-nav__item">
							<a class="site-nav__link" href="catalog.html">Каталог</a>
						</li>
						<li class="site-nav__item">
							<a class="site-nav__link" href="contacts.html">Контакты</a>
						</li>
						<li class="site-nav__item">
							<a class="site-nav__link" href="index.html#popular">
							Популярные товары
							</a>
						</li>
						<li class="site-nav__item">
						  <a class="site-nav__link" href="product.html">
							Товар
						  </a>
						</li>

						<li class="site-nav__item">
						  <a class="site-nav__link" href="order.html">
							Оформить заявку
						  </a>
						</li>
					</ul>
				</nav>
			</div>
		</header>
		<main>
			<section class="hero">
				<h1 id="product__name">Product name</h1>
				<img id="product__image">
			</section>
			<table class="product-table">
			  <caption>Характеристики товара</caption>
			  <thead>
				<tr>
				  <th scope="col">Параметр</th>
				  <th scope="col">Значение</th>
				</tr>
			  </thead>
			  <tbody>
				<tr>
				  <td>Категория</td>
				  <td>Электроника</td>
				</tr>
				<tr>
				  <td>Цена</td>
				  <td>2000 руб.</td>
				</tr>
				<tr>
				  <td>Наличие</td>
				  <td>В наличии</td>
				</tr>
			  </tbody>
			</table>
		</main>
		<footer id="contacts">
